            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: METHOD_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: PRODUCT_INACTIVE, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION,
            INSUFFICIENT_STOCK, USERNAME_TAKEN, PROMO_CODE_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT

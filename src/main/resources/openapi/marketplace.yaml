components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties: &id004
        name: &id005
          type: string
          minLength: 1
          maxLength: 255
        description: &id006
          type: string
          maxLength: 4000
          nullable: true
        price: &id007
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
        stock: &id008
          type: integer
          minimum: 0
          maximum: 2147483647
        category: &id009
          type: string
          minLength: 1
          maxLength: 100
        status: *id003
    ProductUpdate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties: *id004
    ProductResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
      properties:
        id: *id002
        name: *id005
        description: *id006
        price: *id007
        stock: *id008
        category: *id009
        status: *id003
        seller_id: *id002
        created_at: &id010
          type: string
          format: date-time
        updated_at: *id010
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      - totalElements
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          minimum: 0
        page:
          type: integer
        size:
          type: integer
    OrderItemInput:
      type: object
      additionalProperties: false
      required:
      - product_id
      - quantity
      properties:
        product_id: *id002
        quantity:
          type: integer
          minimum: 1
          maximum: 999
    OrderItemResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - product_id
      - quantity
      - price_at_order
      properties:
        id: *id002
        product_id: *id002
        quantity:
          type: integer
        price_at_order: &id011
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
    OrderCreate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemInput'
        promo_code:
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
          nullable: true
    OrderUpdate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemInput'
    OrderStatusUpdate:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - CREATED
          - PAYMENT_PENDING
          - PAID
          - SHIPPED
          - COMPLETED
          - CANCELED
    OrderResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - status
      - promo_code_id
      - total_amount
      - discount_amount
      - items
      - created_at
      - updated_at
      properties:
        id: *id002
        user_id: *id002
        status:
          type: string
          enum:
          - CREATED
          - PAYMENT_PENDING
          - PAID
          - SHIPPED
          - COMPLETED
          - CANCELED
        promo_code_id:
          type: string
          format: uuid
          nullable: true
        total_amount: *id011
        discount_amount: *id011
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        created_at: *id010
        updated_at: *id010
    PromoCreate:
      type: object
      additionalProperties: false
      required:
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      properties:
        code: &id012
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
        discount_type: &id013
          type: string
          enum:
          - PERCENTAGE
          - FIXED_AMOUNT
        discount_value: &id014
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
        min_order_amount: *id011
        max_uses: &id015
          type: integer
          minimum: 1
          maximum: 2147483647
        valid_from: *id010
        valid_until: *id010
        active: &id016
          type: boolean
          default: true
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          type: string
          enum:
          - USER
          - SELLER
          default: USER
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 128
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    UserResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - role
      properties:
        id: *id002
        username:
          type: string
        role:
          type: string
          enum:
          - USER
          - SELLER
          - ADMIN
    TokenResponse:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
    PromoResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      - active
      - current_uses
      properties:
        id: *id002
        code: *id012
        discount_type: *id013
        discount_value: *id014
        min_order_amount: *id011
        max_uses: *id015
        valid_from: *id010
        valid_until: *id010
        active: *id016
        current_uses:
          type: integer
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error_code
      - message
      properties:
        error_code:
          type: string
          enum:
          - VALIDATION_ERROR
          - TOKEN_EXPIRED
          - TOKEN_INVALID
          - REFRESH_TOKEN_INVALID
          - ACCESS_DENIED
          - ORDER_OWNERSHIP_VIOLATION
          - PRODUCT_NOT_FOUND
          - ORDER_NOT_FOUND
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - PRODUCT_INACTIVE
          - ORDER_HAS_ACTIVE
          - INVALID_STATE_TRANSITION
          - INSUFFICIENT_STOCK
          - USERNAME_TAKEN
          - PROMO_CODE_EXISTS
          - PROMO_CODE_INVALID
          - PROMO_CODE_MIN_AMOUNT
          - ORDER_LIMIT_EXCEEDED
          - INTERNAL_ERROR
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
